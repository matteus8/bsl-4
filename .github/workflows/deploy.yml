name: BSL-4 Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ==============================================================================
# Feature Toggles & Global Deployment Controls
# Change any toggle to 'true' or 'false' to control what deploys on commit to main.
# ==============================================================================
env:
  DEPLOY_FRONTEND: "true"          # Build Next.js static export & sync to S3
  DEPLOY_INGESTOR_WORKER: "true"   # Package & deploy bsl4-ingestor Lambda
  DEPLOY_AI_WORKER: "true"         # Package & deploy bsl4-ai-editor Lambda
  INVALIDATE_CLOUDFRONT: "true"    # Invalidate CloudFront CDN edge cache
  AWS_REGION: "us-east-1"

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Deploy Next.js Static Frontend to S3 & CloudFront Edge
  # ----------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to S3 & Edge
    if: env.DEPLOY_FRONTEND == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ""
        run: npm run build

      - name: Sync Static Assets to Amazon S3
        run: |
          BUCKET_NAME="${{ secrets.S3_BUCKET_NAME || 'platformstaq.com' }}"
          aws s3 sync frontend/out/ "s3://${BUCKET_NAME}" \
            --delete \
            --exclude "api/*" \
            --exclude "data/*"

      - name: Invalidate CloudFront CDN Cache
        if: env.INVALIDATE_CLOUDFRONT == 'true'
        run: |
          DIST_ID="${{ secrets.CLOUDFRONT_DIST_ID || 'E24CTJCZZ478NW' }}"
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"
          fi

  # ----------------------------------------------------------------------------
  # JOB 2: Deploy Ingestion Worker Lambda (Python 3.12)
  # ----------------------------------------------------------------------------
  deploy-ingestor:
    name: Deploy Ingestion Worker Lambda
    if: env.DEPLOY_INGESTOR_WORKER == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Ingestion Worker
        run: |
          mkdir -p worker_build
          pip install --target worker_build -r worker/requirements.txt
          cp worker/main.py worker_build/
          cd worker_build && zip -r ../worker.zip . && cd ..

      - name: Update Lambda Function Code
        run: |
          FUNCTION_NAME="${{ secrets.INGESTOR_FUNCTION_NAME || 'bsl4-ingestor' }}"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://worker.zip

  # ----------------------------------------------------------------------------
  # JOB 3: Deploy AI Editorial Verdict Worker Lambda (Python 3.12)
  # ----------------------------------------------------------------------------
  deploy-ai-editor:
    name: Deploy AI Editorial Worker Lambda
    if: env.DEPLOY_AI_WORKER == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package AI Editorial Worker
        run: |
          mkdir -p ai_worker_build
          pip install --target ai_worker_build -r worker/requirements.txt
          cp worker/ai_editor.py ai_worker_build/
          cd ai_worker_build && zip -r ../ai_worker.zip . && cd ..

      - name: Update Lambda Function Code
        run: |
          FUNCTION_NAME="${{ secrets.AI_EDITOR_FUNCTION_NAME || 'bsl4-ai-editor' }}"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://ai_worker.zip
