name: BSL-4 Production CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'system-overview.md'
      - 'application-local.properties.example'
  workflow_dispatch:

# ==============================================================================
# Feature Toggles & Global Configuration
# ==============================================================================
env:
  RUN_SECURITY_GATE: "true"        # Toggle: Run SAST & Dependency Security Audit Gate
  DEPLOY_FRONTEND: "true"          # Toggle: Deploy Next.js frontend to S3 & CloudFront
  DEPLOY_INGESTOR_WORKER: "true"   # Toggle: Package & deploy bsl4-ingestor Lambda
  DEPLOY_AI_WORKER: "true"         # Toggle: Package & deploy bsl4-ai-editor Lambda
  INVALIDATE_CLOUDFRONT: "true"    # Toggle: Invalidate CloudFront edge cache
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::973213517498:role/BSL4GitHubActionsRole"
  S3_BUCKET_NAME: "platformstaq.com"
  CLOUDFRONT_DIST_ID: "E24CTJCZZ478NW"
  INGESTOR_FUNCTION_NAME: "bsl4-ingestor"
  AI_EDITOR_FUNCTION_NAME: "bsl4-ai-editor"

jobs:
  # ============================================================================
  # GATE 0: SAST & Security Quality Analysis
  # ============================================================================
  security-and-quality:
    name: Security & SAST Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_SECURITY_GATE == 'true'

      # -----------------------------------------------------------------------
      # Python SAST & SCA Scanning
      # -----------------------------------------------------------------------
      - name: Setup Python 3.12
        if: env.RUN_SECURITY_GATE == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python SAST & Audit Tools
        if: env.RUN_SECURITY_GATE == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install bandit flake8 pip-audit

      - name: Python SAST Security Scan (Bandit)
        if: env.RUN_SECURITY_GATE == 'true'
        run: |
          echo "Scanning Python codebase for Medium & High security vulnerabilities..."
          bandit -r worker/ -ll -i

      - name: Python Dependency CVE Audit (pip-audit)
        if: env.RUN_SECURITY_GATE == 'true'
        run: |
          echo "Auditing Python dependencies for known CVEs..."
          pip-audit -r worker/requirements.txt --desc on

      - name: Python Syntax & Error Linting (Flake8)
        if: env.RUN_SECURITY_GATE == 'true'
        run: |
          echo "Checking Python syntax and fatal errors..."
          flake8 worker/ --count --select=E9,F63,F7,F82 --show-source --statistics

      # -----------------------------------------------------------------------
      # Node.js & TypeScript Security / Quality Gate
      # -----------------------------------------------------------------------
      - name: Setup Node.js 22
        if: env.RUN_SECURITY_GATE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependency Vulnerability Audit (High/Critical)
        if: env.RUN_SECURITY_GATE == 'true'
        working-directory: frontend
        run: |
          echo "Auditing npm dependencies for High and Critical vulnerabilities..."
          npm audit --audit-level=high

      - name: TypeScript Static Type Checking
        if: env.RUN_SECURITY_GATE == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

  # ============================================================================
  # JOB 1: Deploy Next.js Static Frontend to S3 & CloudFront Edge
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend to S3 & Edge
    needs: [security-and-quality]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: env.DEPLOY_FRONTEND == 'true'

      # -----------------------------------------------------------------------
      # INFRA STEP: AWS Connectivity (OIDC)
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials (OIDC)
        if: env.DEPLOY_FRONTEND == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        if: env.DEPLOY_FRONTEND == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        if: env.DEPLOY_FRONTEND == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build Next.js Static Export
        if: env.DEPLOY_FRONTEND == 'true'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ""
        run: npm run build

      - name: Sync Static Assets to Amazon S3
        if: env.DEPLOY_FRONTEND == 'true'
        run: |
          aws s3 sync frontend/out/ "s3://${{ env.S3_BUCKET_NAME }}" \
            --delete \
            --exclude "api/*" \
            --exclude "data/*"

      - name: Invalidate CloudFront CDN Cache
        if: env.DEPLOY_FRONTEND == 'true' && env.INVALIDATE_CLOUDFRONT == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DIST_ID }}" \
            --paths "/*"

  # ============================================================================
  # JOB 2: Deploy Ingestion Worker Lambda (Python 3.12)
  # ============================================================================
  deploy-ingestor:
    name: Deploy Ingestion Worker Lambda
    needs: [security-and-quality]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: env.DEPLOY_INGESTOR_WORKER == 'true'

      # -----------------------------------------------------------------------
      # INFRA STEP: AWS Connectivity (OIDC)
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials (OIDC)
        if: env.DEPLOY_INGESTOR_WORKER == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python 3.12
        if: env.DEPLOY_INGESTOR_WORKER == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Package Ingestion Worker
        if: env.DEPLOY_INGESTOR_WORKER == 'true'
        run: |
          mkdir -p worker_build
          pip install --target worker_build -r worker/requirements.txt
          cp worker/main.py worker_build/
          cd worker_build && zip -r ../worker.zip . && cd ..

      - name: Update Lambda Function Code
        if: env.DEPLOY_INGESTOR_WORKER == 'true'
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.INGESTOR_FUNCTION_NAME }}" \
            --zip-file fileb://worker.zip

      - name: Trigger Ingestion Worker Execution
        if: env.DEPLOY_INGESTOR_WORKER == 'true'
        run: |
          echo "Waiting for Lambda function update to settle..."
          aws lambda wait function-updated --function-name "${{ env.INGESTOR_FUNCTION_NAME }}"
          echo "Invoking ingestion worker asynchronously to immediately populate S3 data..."
          aws lambda invoke \
            --function-name "${{ env.INGESTOR_FUNCTION_NAME }}" \
            --invocation-type Event \
            /tmp/ingestor_response.json
          echo "Ingestor Lambda invoked successfully."

  # ============================================================================
  # JOB 3: Deploy AI Editorial Verdict Worker Lambda (Python 3.12)
  # ============================================================================
  deploy-ai-editor:
    name: Deploy AI Editorial Worker Lambda
    needs: [security-and-quality]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: env.DEPLOY_AI_WORKER == 'true'

      # -----------------------------------------------------------------------
      # INFRA STEP: AWS Connectivity (OIDC)
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials (OIDC)
        if: env.DEPLOY_AI_WORKER == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python 3.12
        if: env.DEPLOY_AI_WORKER == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt

      - name: Package AI Editorial Worker
        if: env.DEPLOY_AI_WORKER == 'true'
        run: |
          mkdir -p ai_worker_build
          pip install --target ai_worker_build -r worker/requirements.txt
          cp worker/ai_editor.py ai_worker_build/
          cd ai_worker_build && zip -r ../ai_worker.zip . && cd ..

      - name: Update Lambda Function Code
        if: env.DEPLOY_AI_WORKER == 'true'
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.AI_EDITOR_FUNCTION_NAME }}" \
            --zip-file fileb://ai_worker.zip

      - name: Trigger AI Editor Execution
        if: env.DEPLOY_AI_WORKER == 'true'
        run: |
          echo "Waiting for AI Editor Lambda function update to settle..."
          aws lambda wait function-updated --function-name "${{ env.AI_EDITOR_FUNCTION_NAME }}"
          echo "Invoking AI Editor asynchronously to generate editorial verdict..."
          aws lambda invoke \
            --function-name "${{ env.AI_EDITOR_FUNCTION_NAME }}" \
            --invocation-type Event \
            /tmp/ai_editor_response.json
          echo "AI Editor Lambda invoked successfully."
