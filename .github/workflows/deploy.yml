name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::973213517498:role/BSL4GitHubActionsRole"
  S3_BUCKET: "platformstaq.com"
  CLOUDFRONT_DIST_ID: "E24CTJCZZ478NW"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build and Deploy Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          aws s3 sync out/ "s3://${{ env.S3_BUCKET }}" --delete --exclude "api/*" --exclude "data/*"
          aws cloudfront create-invalidation --distribution-id "${{ env.CLOUDFRONT_DIST_ID }}" --paths "/*"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Deploy Ingestion Worker Lambda
        run: |
          mkdir -p build_ingestor
          pip install --target build_ingestor -r worker/requirements.txt
          cp worker/main.py build_ingestor/
          cd build_ingestor && zip -r ../worker.zip . && cd ..
          aws lambda update-function-code --function-name bsl4-ingestor --zip-file fileb://worker.zip

      - name: Deploy AI Editor Lambda
        run: |
          mkdir -p build_ai
          pip install --target build_ai -r worker/requirements.txt
          cp worker/ai_editor.py build_ai/
          cd build_ai && zip -r ../ai_worker.zip . && cd ..
          aws lambda update-function-code --function-name bsl4-ai-editor --zip-file fileb://ai_worker.zip
